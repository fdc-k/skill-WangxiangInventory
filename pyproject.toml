[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wangxiang-inventory"
version = "1.0.0"
description = "祥旺库存工具：多来源库存文件 -> 统一格式 Excel -> WooCommerce 差异比对与同步"
requires-python = ">=3.10"   # 推荐 3.12+（WorkBuddy 自带 3.13）
dependencies = [
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "numpy>=1.24",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.scripts]
wangxiang = "wangxiang.cli:main"

[tool.setuptools]
packages = ["wangxiang"]
